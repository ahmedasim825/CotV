# Milo PC agent configuration.
#
# Copy to `milo_agent.toml` beside milo_pc_agent.py and edit. The real file
# holds a shared secret, so it is gitignored — keep it out of the repo.

[server]
# 0.0.0.0 listens on every interface, which is what makes the agent
# reachable from the phone. Keep this machine on a trusted home network:
# anyone on the same Wi-Fi can reach the port, and only the token stops
# them using it.
host = "0.0.0.0"
port = 8765

# Shared secret. The phone sends it as `Authorization: Bearer <token>`.
# Generate one with:  py -c "import secrets; print(secrets.token_urlsafe(32))"
# Paste the same value into Milo settings on the phone.
token = "replace-me-with-a-generated-token"

[security]
# Open mode. With these off (the default here), the agent can only open what
# the [apps] and [paths] tables name, and literal paths must sit inside
# allowed_roots — so a request cannot make this process run something you
# did not list.
#
# Turn them on for a personal machine you want Milo to drive completely:
# any executable by name or path, any file or folder on any drive, any URL.
# Understand what that means first. In open mode the token is the only thing
# between this port and arbitrary process launch, so it is only appropriate
# on a network you control, with a token you generated.
allow_any_app = false
allow_any_path = false

# In restricted mode this is the allowlist. In open mode it is a set of
# pins: an entry here wins over automatic resolution, which is useful for
# names that would not resolve ("VS Code") or when a specific build must be
# used. A value is either an absolute executable path or a name on PATH.
#
# Do not pin an app you have not installed — the pin wins over the
# resolution that would otherwise start working once you do.
[apps]
vs_code = "C:/Users/you/AppData/Local/Programs/Microsoft VS Code/Code.exe"
terminal = "wt"
notepad = "notepad"

# Folder and file shorthands, so "open the study folder" needs no path.
[paths]
study = "D:/Study"
downloads = "~/Downloads"
documents = "~/Documents"

# Only consulted in restricted mode. Literal paths are accepted when they
# resolve inside one of these roots. Leave the list empty to refuse literal
# paths entirely and allow only the aliases above.
allowed_roots = ["D:/Study", "~/Documents", "~/Downloads"]

# Local speech models. Both are optional — the agent runs without either and
# answers 503 on /transcribe and /speak, which the app handles: voice input
# reports that it needs the agent, and replies are read by the Windows OS
# voice instead of Kokoro.
[speech]
# Faster-Whisper's checkpoint, downloaded on first use and cached under
# ~/.cache/huggingface. base.en is the smallest one that hears "Maghrib" as
# a word; drop to tiny.en on a machine short on memory.
whisper_model = "base.en"
# int8 on CPU. Use "float16" only with a CUDA build of CTranslate2.
whisper_compute_type = "int8"

# Kokoro's two files, from the kokoro-onnx releases:
# https://github.com/thewh1teagle/kokoro-onnx/releases
# A relative path is taken as relative to the agent, not to whatever
# directory it happened to be started from.
kokoro_model = "models/kokoro-v1.0.onnx"
kokoro_voices = "models/voices-v1.0.bin"
kokoro_voice = "af_heart"
kokoro_speed = 1.0
