name: Build

# One workflow for both targets so a change cannot land green on iOS while
# breaking Windows. Both platform jobs wait on `test`, so a failing analyze
# or test run costs one ubuntu minute instead of a macOS and a Windows build.

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Analyze and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  ios:
    name: iOS IPA
    needs: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - run: flutter pub get

      # Groq and Gemini keys are still not injected: a --dart-define is
      # recoverable from the binary with `strings`, and Milo asks for those
      # once on device and keeps them in the Keychain.
      #
      # The two Supabase values are different in kind, not just in degree.
      # The publishable key is designed to ship inside clients — every table
      # it can reach is behind row-level security — and without them
      # SupabaseConfig.isConfigured is false, main() skips
      # Supabase.initialize entirely, and the artifact cannot sync at all.
      # An IPA that cannot sign in is not a build of this app.
      #
      # Written as one folded line rather than a shell continuation so the
      # step reads the same on both runners.
      - name: Build unsigned iOS app
        run: >
          flutter build ios --no-codesign --release
          --dart-define=SUPABASE_URL=${{ secrets.SUPABASE_URL }}
          --dart-define=SUPABASE_PUBLISHABLE_KEY=${{ secrets.SUPABASE_PUBLISHABLE_KEY }}

      - name: Package payload for SideStore
        run: |
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r Milo.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: Milo.ipa

  windows:
    name: Windows MSIX
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - run: flutter pub get

      # Same two defines as the iOS job, for the same reason.
      - name: Build Windows release
        run: >
          flutter build windows --release
          --dart-define=SUPABASE_URL=${{ secrets.SUPABASE_URL }}
          --dart-define=SUPABASE_PUBLISHABLE_KEY=${{ secrets.SUPABASE_PUBLISHABLE_KEY }}

      # --build-windows false packages the build above rather than running a
      # second one. --install-certificate false because a runner has no
      # certificate store worth writing to; msix still signs with a
      # generated test certificate, which is what the .cer beside the
      # package is for.
      # No signing certificate on a runner, and none should be committed, so
      # CI packages unsigned. The artifact is for inspection and for proving
      # the Windows build still packages; installing it needs a locally
      # signed build (see README > Signing).
      - name: Package MSIX
        run: dart run msix:create --build-windows false --store

      - uses: actions/upload-artifact@v4
        with:
          name: windows-msix
          path: build/windows/x64/runner/Release/*.msix
